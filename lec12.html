<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square{
            height:100px;
            width:100px;
            background-color: aqua;
        }
        .square:hover{
            background-color: blue;
            height: 100px;
            width: 100px;
            transition: all 2s 0.1s;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="square"></div>
</body>
</html>
