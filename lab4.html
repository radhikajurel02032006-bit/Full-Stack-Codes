<!DOCTYPE html>
<html>
<head>
    <title>Sticky Position</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        .header {
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .sticky-menu {
            position: sticky;
            top: 0;
            background-color: orange;
            padding: 15px;
            text-align: center;
        }
        .content {
            padding: 20px;
        }
    </style>
</head>
<body>
<!-- Sticky -> static + fixed -->
    <div class="header">
        <h1>My Website</h1>
    </div>
    <div class="sticky-menu">
        Home | About | Contact
    </div>
    <div class="content">
        <h2>Welcome</h2>
        <p>This is some content.</p>
        <p>Scroll down and observe the orange menu.</p>
        <br><br><br><br>
        <h2>Section 1</h2>
        <p>More content here...</p>
        <br><br><br><br><br>
        <h2>Section 2</h2>
        <p>Keep scrolling...</p>
        <br><br><br><br><br>
        <h2>Section 3</h2>
        <p>The menu remains at the top!</p>
        <br><br><br><br><br>
        <h2>End</h2>
    </div>
</body>
</html>
