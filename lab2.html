<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--create a signup form with fields like email, phone no. , 
    father name, mother name, roll no, address, DOB, Blood group, gender, -->
    <h1>Signup</h1>
    <label for="roll no.">Roll no</label>
    <input name="roll no."  placeholder="Enter your roll no.">
    <br>
    <br>
    <label for="Father name"> Father Name</label>
    <input name="Father Name" placeholder="Name">
    <br>
    <br>
    <label for="Mother name">Mother Name</label>
    <input name="Mother Name" placeholder="Name">
    <br>
    <br>
    <label for="number">Phone No.</label>
    <input number="Phone no." placeholder="number">
    <br>
    <br>
    <label for="address">Address</label>
    <input type="address" placeholder="address">
    <br>
    <br>
    <label for="DOB">DOB</label>
    <input type="date">
    <br>
    <br>
    <label for="Email">Email</label>
    <input type="email" placeholder="Enter your email">
    <br>
    <br>
    <label for="blood group">Blood Group</label>
    <select id="Blood group" name="blood group" required>
        <option value="choose">choose</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
    </select>
    <br>
    <br>
    <label for="gender">Gender:</label>
    <input type="radio" id="male" value="male">
    <label for="male">M</label>
    <input type="radio" id="female" value="female"> 
    <label for="female">F</label>
    <br>
    <br>
    <button>Submit</button>
</body>
</html>
