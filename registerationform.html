<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration form</title>
</head>
<body>
    <h1>Student Registeration Form</h1>
    <form >
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="Name" placeholder=" Enter your name" required><br>
        <br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Name" placeholder="Enter your email" required><br>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br>
        <br>
        <label for="mobile">Contact No:</label>
        <input type="tel" id="mobile" name="contact" placeholder="Enter your Contact number" required>
        <br>
        <br>
        <label for="dob">Date of Birth:</label>
        <input type="date" placeholder="Enter your date of birth" required>
        <br>
        <br>
       <label>Gender:</label>

<input type="radio"
       id="male"
       name="gender"
       value="male">

<label for="male">Male</label>


<input type="radio"
       id="female"
       name="gender"
       value="female">

<label for="female">Female</label>
        <br>
        <br>
        <label for="Course">Course:</label>
        <select name="Course" id="Course">
            <option value="">Select Course</option>
            <option value="Btech">Btech</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="MBA">MBA</option>
        </select>
        <br>
        <br>
        <label for="Skills">Skills:</label>
        <input type="checkbox" 
        id="html" 
        name="skills" 
        value="html">
        <label for="html">HTML</label>
        <input type="checkbox" 
        id="css" 
        name="skills" 
        value="css">
        <label for="css">CSS</label>
        <input type="checkbox" 
        id="Javascript" 
        name="skills" 
        value="javascript">
        <label for="Javascript">JAVASCRIPT</label>
        <input type="checkbox" 
        id="mongodb"
         name="skills" 
         value="mongodb">
        <label for="mongodb">MONGODB</label>
    </form>
</body>
</html>
