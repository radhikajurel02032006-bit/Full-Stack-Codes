<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div::after{
            content: "GLA University";
            color: black;
        }
        p::before{
            content: "I am from ";
            color: black;
        }
    </style>
</head>
<body>
    <!-- pseudoelements - used to add/modify specific parts of an element.
     it is represented by double colon -->
     <div>I am from </div>
     <p>Mathura</p>
     <section> I love coding</section><br>
     <article>I love to  travel around the world</article>
</body>
</html>
