<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #square{
            height:150px;
            width: 150px;
            background-color:blueviolet;
            box-shadow: innershadowing offset-x offset-y blur spread color;
            box-shadow: inset 4px 4px 20px 5px crimson;
        }
        #rectangle{
            height:200px;
            width:300px;
            background-color:greenyellow;
            box-shadow:  innershadowing offset-x offset-y blur spread color;
            box-shadow: inset 4px 4px 20px 5px blue;
        }
        #circle{
            height:100px;
            width:100px;
            background-color:blue;
            border-radius: 50%;
            box-shadow: innershadowing offset-x offset-y blur spread color;
            box-shadow: inset 4px 4px 20px 5px fuchsia;
        }
         
    </style>
</head>
<body>
    <!--Square-rectangle-circle-->
    <div id="square"></div>
    <br>
    <div id="rectangle"></div>
    <br>
    <div id="circle"></div>
</body>
</html>
