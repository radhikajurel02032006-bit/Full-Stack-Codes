<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents</title>
</head>
<body>
    <!--Input tags - it is used to take user inputs-->
    <form action="POST">
    <label for="roll no.">Roll no</label>
    <input  id="roll no." name="roll no."  type="number" placeholder="Enter your roll no.">
    <br>
    <br>
    <label for="Password">Password</label>
    <input type="password" placeholder="Enter your password">
    <br>
    <br>
    <label for="Email">Email</label>
    <input type="email" placeholder="Enter your email">
    <br>
    <br>
    <input type="date">
    <br>
    <br>
    <input type="datetime-local">
    <br>
    <br>
    <!--dropdown- it is a menu where we can see multiple items in a list format-->
    <select name="id=">
        <option value="choose a skill">Choose a skill</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JS">JS</option>
    </select>
    <br>
    <br>
    <label for="gender">Gender</label>
    <input type="radio" id="male" value="male">
    <label for="male">M</label>
    <input type="radio" id="female" value="female"> 
    <label for="female">F</label>
    <br>
    <br>
    <input type="checkbox">
    I agree to the terms & conditions above
</input>
    <br>
    <br>

    <!--button- it is used to perform any action-->
    <input type="file">
    <br>
    <br>
    <input type="color">
    <br>
    <br>
    <input type="range" step="50">
    <br>
    <br>
    <input type="time".
    <br>
    <br>
    <button type="reset">Reset</button>
    <button type="submit">Submit</button>
    </form>
</body>
</html>
